name: MedIntel CI

on:
  pull_request:
  push:
    branches:
      - main
      - rochan-dev-phase8-readiness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -c backend/constraints.txt

      - name: Compile backend source
        run: |
          python -m compileall -q backend/app backend/services

      - name: Run authentication regression tests
        run: |
          python -m unittest discover -s backend/tests -p "test_auth.py" -v

  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  deployment:
    name: Deployment configuration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      POSTGRES_PASSWORD: phase8-ci-only-password
      JWT_SECRET: phase8-ci-only-jwt-secret-not-runtime
      CLINICIAN_USERNAME: ci-clinician
      CLINICIAN_PASSWORD_HASH: ci-placeholder-not-runtime
      MEDGEMMA_MODEL_PATH: /tmp/medgemma-ci-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare CI Compose environment
        run: cp .env.example .env

      - name: Validate Compose
        run: docker compose config -q

      - name: Build production frontend container
        run: docker compose build frontend
